      - "analysis"
      - "condition"
      - "name"
      - "operation_mode"
      - "priority"
      - "source"
      - "uuid"
      type: "object"
      properties:
        uuid:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: "string"
        author:
          type: "string"
        condition:
          type: "string"
        analysis:
          $ref: "#/components/schemas/vuln-policy-analysis"
        ratings:
          maxItems: 3
          type: "array"
          items:
            $ref: "#/components/schemas/vuln-policy-rating"
        operation_mode:
          $ref: "#/components/schemas/vuln-policy-operation-mode"
        priority:
          maximum: 100
          minimum: 0
          type: "integer"
          format: "int32"
        source:
          $ref: "#/components/schemas/vuln-policy-source"
        valid_from:
          $ref: "#/components/schemas/timestamp"
        valid_until:
          $ref: "#/components/schemas/timestamp"
        created:
          $ref: "#/components/schemas/timestamp"
        updated:
          $ref: "#/components/schemas/timestamp"
    update-vuln-policy-request:
      required:
      - "analysis"
      - "condition"
      - "name"
      type: "object"
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: "string"
        description:
          maxLength: 512
          type: "string"
        author:
          maxLength: 255
          type: "string"
        condition:
          maxLength: 4096
          minLength: 1
          type: "string"
        analysis:
          $ref: "#/components/schemas/vuln-policy-analysis"
        ratings:
          maxItems: 3
          type: "array"
          items:
            $ref: "#/components/schemas/vuln-policy-rating"
        operation_mode:
          $ref: "#/components/schemas/vuln-policy-operation-mode"
        priority:
          maximum: 100
          minimum: 0
          type: "integer"
          format: "int32"
          default: 0
        valid_from:
          $ref: "#/components/schemas/timestamp"
        valid_until:
          $ref: "#/components/schemas/timestamp"
    list-vuln-policy-bundles-response:
      required:
      - "items"
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/list-vuln-policy-bundles-response-item"
      allOf:
      - $ref: "#/components/schemas/paginated-response"
    vuln-policy-bundle-sync-status:
      required:
      - "status"
      type: "object"
      properties:
        status:
          type: "string"
          description: "Status of the synchronization."
          enum:
          - "PENDING"
          - "RUNNING"
          - "COMPLETED"
