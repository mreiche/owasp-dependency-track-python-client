---
openapi: "3.0.3"
info:
  title: "OWASP Dependency-Track (Server v5.1.0)"
  description: "# REST API of OWASP Dependency-Track\n\n## Pagination\n\nThis API\
    \ implements token-based pagination.\nCollection responses have the following\
    \ structure:\n\n```json\n{\n  \"items\": [...],\n  \"next_page_token\": \"abcdefg\"\
    ,\n  \"total\": {\n    \"count\": 100,\n    \"type\": \"EXACT\"\n  }\n}\n```\n\
    \n`next_page_token` is present when more items exist, and absent otherwise.\n\
    To fetch the next page, pass it as the `page_token` query parameter.\n\nTo navigate\
    \ backwards, clients should keep track of previous page tokens\nas they paginate\
    \ through collections. The API does *not* provide\nbackward navigation!\n\nCollections\
    \ that support sorting will only consider the `sort_by`\nand `sort_direction`\
    \ query parameters for the request of the first\npage. For subsequent pages, sorting\
    \ preferences are bound to the\npage token.\n\nPage tokens are opaque strings.\
    \ Clients should not try to interpret\nor generate them. Their format may change\
    \ without notice.\n\nThe `total` object discloses how many items exist in the\
    \ collection\n*across all pages*. Because counting is expensive, some collections\n\
    that hold *a lot* of items may return partial counts (type `AT_LEAST`)\ninstead\
    \ of exact counts (type `EXACT`). Which type to expect is usually\ndocumented\
    \ in the operation's description.\n\n## Sorting\n\nItems in a collection can be\
    \ sorted using the `sort_by` and `sort_direction`\nquery parameters. Which fields\
    \ are sortable is documented in the respective\noperation's description.\n\nNote\
    \ that if no sortable fields are documented for an operation,\nsorting is not\
    \ supported *at all*.\n\n## Field expansion\n\nSome collection endpoints support\
    \ an `expand` query parameter.\nPassing an expand value includes optional fields\
    \ in each response item\nthat are omitted by default, typically because they are\
    \ expensive to compute\nand only needed in specific contexts.\n\nValid `expand`\
    \ values for an endpoint are listed in its operation description.\nUnknown values\
    \ are silently ignored.\n\n## Errors\n\nAll error responses use the `application/problem+json`\
    \ media type\nas defined in [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457.html).\n\
    \nExample:\n\n```json\n{\n  \"type\": \"about:blank\",\n  \"status\": 404,\n \
    \ \"title\": \"Resource Not Found\",\n  \"detail\": \"No project with UUID 0976ef46-e4a0-4be4-8b0e-00e9d3625c1f\
    \ exists\"\n}\n```\n\nA request that takes too long to complete is aborted and\
    \ rejected\nwith `504 Gateway Timeout`. Any operation can time out, so operations\n\
    do not document it individually.\n\n## Authentication\n\nTwo credential types\
    \ are accepted:\n\n- **API key** via the `X-Api-Key` request header. API keys\
    \ are\n  long-lived and intended for machine-to-machine integrations.\n- **Bearer\
    \ token** via the `Authorization: Bearer <token>` request\n  header. Bearer tokens\
    \ are short-lived, user-bound, and opaque\n  server-issued session tokens.\n\n\
    Bearer tokens are obtained from one of the following endpoints:\n\n- `POST /api/v1/user/login`\n\
    - `POST /api/v1/user/oidc/login`\n\nAPI v2 does not yet provide its own login\
    \ endpoints; clients use\nthe v1 endpoints above to acquire tokens and then call\
    \ v2 with them.\n\nTokens are valid for 8 hours by default and **cannot be refreshed**.\n\
    Clients must re-authenticate once a token expires.\n\nRequests with missing or\
    \ invalid credentials are rejected with\n`401 Unauthorized`.\n\n## Authorization\n\
    \nAccess is gated by named permissions. Operations document\nthe permission(s)\
    \ they require; operations without a documented\npermission requirement only require\
    \ authentication.\n\nWhen the *Portfolio Access Control* feature is enabled\n\
    (disabled by default), project-scoped operations additionally enforce\nper-project\
    \ access via team membership. The `PORTFOLIO_ACCESS_CONTROL_BYPASS`\npermission\
    \ grants access to all projects regardless of team mappings.\nWhen the feature\
    \ is disabled, all authenticated callers holding the required\npermission can\
    \ access all projects.\n\nAuthenticated requests that lack the required permission,\
    \ or that\ntarget a project the caller cannot access, are rejected with\n`403\
    \ Forbidden`.\n\n## HTTP Methods\n\n| Method   | Semantics                  |\n\
    |----------|----------------------------|\n| `GET`    | Retrieve a resource  \
    \      |\n| `POST`   | Create a new resource      |\n| `PUT`    | Update a resource\
    \          |\n| `PATCH`  | Partially update a resource|\n| `DELETE` | Delete a\
    \ resource          |\n\n## Response Conventions\n\nCreate and update operations\
    \ (`POST`, `PUT`, `PATCH`) do not return\nthe full resource in the response. They\
    \ return either no body,\nor only server-generated identifiers (e.g. a UUID).\n\
    `POST` responses may include a `Location` header linking to the\ncreated resource.\n\
    \nDelete operations return `204 No Content` with no body.\n\n## Deprecations\n\
    \nOperations may be removed or replaced over time. When a response\ncarries the\
    \ `X-API-Deprecated: true` header, the operation that\nproduced it is deprecated\
    \ and may be removed in a future release.\nClients should check for this header\
    \ on every response and surface\nit (e.g. via a log warning) so that operators\
    \ are aware of upcoming\nbreakages. The respective operation's description points\
    \ out which\nalternative operation(s) to use.\n\n## Internal operations\n\nOperations\
    \ under the `/internal` path prefix expose system internals\nand are reserved\
    \ for first-party use. They are **not** part of the\nstable v2 API contract and\
    \ may change or be removed without notice.\nThird-party clients should not depend\
    \ on them."
  contact:
    name: "The Dependency-Track Authors"
    url: "https://github.com/DependencyTrack/dependency-track"
    email: "dependencytrack@owasp.org"
  license:
    name: "Apache-2.0"
    url: "https://www.apache.org/licenses/LICENSE-2.0.html"
  version: "2.0.0"
  x-server-version: "5.1.0"
servers:
- url: "/api/v2"
security:
- apiKeyAuth: []
- bearerAuth: []
tags:
- name: "Components"
  description: "Endpoints related to components"
- name: "Extensions"
  description: "Endpoints related to extensions"
- name: "Kev Data Sources"
  description: "Endpoints related to KEV data sources"
- name: "Projects"
  description: "Endpoints related to projects"
- name: "Secrets"
  description: "Endpoints related to secrets"
- name: "System Capabilities"
  description: "Endpoints exposing the capabilities of the running server"
- name: "Task Queues"
  description: "Endpoints related to task queue management"
- name: "Vuln Data Sources"
  description: "Endpoints related to vulnerability data sources"
- name: "Vuln Policies"
  description: "Endpoints related to vulnerability policies"
- name: "Vulns"
  description: "Endpoints related to vulnerabilities"
- name: "Workflows"
  description: "Endpoints related to workflows"
paths:
  /components:
    get:
      tags:
      - "Components"
      summary: "List all components"
      description: "Retrieves a list of all components matching the provided filter\
        \ criteria.\n\nText filters are case-insensitive.\n\n### Sortable fields\n\
        \nSorting is supported for the following fields:\n\n* `name`\n* `group`\n\
        * `last_inherited_risk_score`\n\n### Expandable fields\n\nThe following fields\
        \ can be included via `expand`:\n\n* `metrics`\n* `package_metadata`\n* `package_artifact_metadata`\n\
        \nRequires permission `VIEW_PORTFOLIO`"
      operationId: "listComponents"
      parameters:
      - name: "group_contains"
        in: "query"
        description: "Filter by group (substring match)"
        schema:
          type: "string"
      - name: "name_contains"
        in: "query"
        description: "Filter by name (substring match)"
        schema:
          type: "string"
      - name: "version_contains"
        in: "query"
        description: "Filter by version (substring match)"
        schema:
          type: "string"
      - name: "purl_prefix"
        in: "query"
        description: "Filter by PURL (prefix match).\n\nMust be a valid PURL, with\
          \ at least `pkg:<ecosystem>/<name>` populated."
        schema:
          type: "string"
      - name: "cpe"
        in: "query"
        description: "Filter by CPE (exact match).\n\nMust be a valid CPE."
        schema:
          type: "string"
      - name: "swid_tag_id_contains"
        in: "query"
        description: "Filter by SWID Tag ID (substring match)"
        schema:
          type: "string"
      - name: "hash_type"
        in: "query"
        description: "The hash type to filter by"
        schema:
          type: "string"
          enum:
          - "MD5"
          - "SHA1"
          - "SHA_256"
          - "SHA_384"
          - "SHA_512"
          - "SHA3_256"
          - "SHA3_384"
          - "SHA3_512"
          - "BLAKE2B_256"
          - "BLAKE2B_384"
          - "BLAKE2B_512"
          - "BLAKE3"
          - "STREEBOG_256"
          - "STREEBOG_512"
      - name: "hash"
        in: "query"
        description: "Filter by hash value (exact match).\n\nRequires `hash_type`\
          \ to be set."
        schema:
          type: "string"
      - name: "package_artifact_published_since"
        in: "query"
        description: "Filter by package artifact publish date (inclusive lower bound).\n\
          \nNote that components without resolved package artifact metadata,\nor whose\
          \ upstream repository did not report a publication date,\nare excluded whenever\
          \ `package_artifact_published_since` or\n`package_artifact_published_before`\
          \ is set."
        schema:
          $ref: "#/components/schemas/timestamp"
      - name: "package_artifact_published_before"
        in: "query"
        description: "Filter by package artifact publish date (exclusive upper bound)."
        schema:
          $ref: "#/components/schemas/timestamp"
      - name: "project_state"
        in: "query"
        description: "Filter by the state of the project that the component belongs\
          \ to.\n\nOmit to include components from projects in any state."
        schema:
          $ref: "#/components/schemas/project-state"
      - name: "project_latest_version"
        in: "query"
        description: "Filter by whether the project the component belongs to is flagged\
          \ as the latest version.\n\nWhen `true`, only components from latest-version\
          \ projects are returned.\nWhen `false`, only components from non-latest\
          \ projects are returned.\nOmit to include components regardless of the flag."
        schema:
          type: "boolean"
      - name: "expand"
        in: "query"
        description: "Optional fields to include in each component response item.\
          \ Unknown values are silently ignored."
        style: "form"
        explode: true
        schema:
          type: "array"
          items:
            type: "string"
      - name: "limit"
        in: "query"
        description: "Maximum number of items to retrieve from the collection"
        schema:
          maximum: 1000
          minimum: 1
          type: "integer"
          format: "int32"
          default: 100
      - name: "page_token"
        in: "query"
        description: "Opaque token pointing to a specific position in a collection"
        schema:
          type: "string"
      - name: "sort_direction"
        in: "query"
        schema:
          $ref: "#/components/schemas/sort-direction"
      - name: "sort_by"
        in: "query"
        description: "Field to sort by. Refer to the operation description for information\
          \ about which fields are sortable."
        schema:
          maxLength: 255
          minLength: 1
          type: "string"
      responses:
        "200":
          description: "A list of components matching the provided filters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list-components-response"
        "400":
          description: "Bad Request"
          content:
            application/problem+json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/invalid-sort-field-problem-details"
                - $ref: "#/components/schemas/problem-details"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        default:
          $ref: "#/components/responses/generic-error"
    post:
      tags:
      - "Components"
      summary: "Creates a new component for the project"
      description: "Requires permission `PORTFOLIO_MANAGEMENT` or `PORTFOLIO_MANAGEMENT_UPDATE`"
      operationId: "createComponent"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create-component-request"
        required: true
      responses:
        "201":
          description: "Component Created"
          headers:
            Location:
              description: "URL of the created component"
              schema:
                type: "string"
                format: "uri"
        "400":
          description: "Bad Request"
          content:
            application/problem+json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/invalid-request-problem-details"
                - $ref: "#/components/schemas/problem-details"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        "409":
          $ref: "#/components/responses/generic-conflict-error"
        default:
          $ref: "#/components/responses/generic-error"
  /extension-points:
    get:
      tags:
      - "Extensions"
      summary: "List all extension points"
      description: "Returns a list of extension points, sorted by name in ascending\
        \ order.\n\nRequires the `SYSTEM_CONFIGURATION` or `SYSTEM_CONFIGURATION_READ`\
        \ permission."
      operationId: "listExtensionPoints"
      responses:
        "200":
          description: "List of extension points"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list-extension-points-response"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        default:
          $ref: "#/components/responses/generic-error"
  /extension-points/{extension_point_name}/extensions:
    get:
      tags:
      - "Extensions"
      summary: "List all extensions"
      description: "Returns a list of extensions for a given extension point, sorted\
        \ by name in ascending order.\n\nRequires the `SYSTEM_CONFIGURATION` or `SYSTEM_CONFIGURATION_READ`\
        \ permission."
      operationId: "listExtensions"
      parameters:
      - name: "extension_point_name"
        in: "path"
        description: "Name of the extension point"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "List of extensions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list-extensions-response"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        "404":
          $ref: "#/components/responses/generic-not-found-error"
        default:
          $ref: "#/components/responses/generic-error"
  /extension-points/{extension_point_name}/extensions/{extension_name}/config:
    get:
      tags:
      - "Extensions"
      summary: "Get extension configuration"
      description: "Returns the configuration of an extension.\n\nRequires the `SYSTEM_CONFIGURATION`\
        \ or `SYSTEM_CONFIGURATION_READ` permission."
      operationId: "getExtensionConfig"
      parameters:
      - name: "extension_point_name"
        in: "path"
        description: "Name of the extension point"
        required: true
        schema:
          type: "string"
      - name: "extension_name"
        in: "path"
        description: "Name of the extension"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "List of extensions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get-extension-config-response"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        "404":
          $ref: "#/components/responses/generic-not-found-error"
        default:
          $ref: "#/components/responses/generic-error"
    put:
      tags:
      - "Extensions"
      summary: "Update extension configuration"
      description: "Updates the configuration of an extension.\n\n**Do not use clear\
        \ text credentials in the supplied config**.\nFields annotated with `x-secret-ref`\
        \ in the config schema expect\na name of a managed secret, which is resolved\
        \ internally by the API.\n\nRequires the `SYSTEM_CONFIGURATION` or `SYSTEM_CONFIGURATION_UPDATE`\
        \ permission."
      operationId: "updateExtensionConfig"
      parameters:
      - name: "extension_point_name"
        in: "path"
        description: "Name of the extension point"
        required: true
        schema:
          type: "string"
      - name: "extension_name"
        in: "path"
        description: "Name of the extension"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/update-extension-config-request"
        required: true
      responses:
        "204":
          description: "Configuration updated"
        "304":
          description: "Not Modified"
        "400":
          description: "Bad Request"
          content:
            application/problem+json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/json-schema-validation-problem-details"
                - $ref: "#/components/schemas/problem-details"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        "404":
          $ref: "#/components/responses/generic-not-found-error"
        default:
          $ref: "#/components/responses/generic-error"
  /extension-points/{extension_point_name}/extensions/{extension_name}/config-schema:
    get:
      tags:
      - "Extensions"
      summary: "Get extension configuration schema"
      description: "Returns the JSON schema for an extension's configuration.\n\n\
        Requires the `SYSTEM_CONFIGURATION` or `SYSTEM_CONFIGURATION_READ` permission."
      operationId: "getExtensionConfigSchema"
      parameters:
      - name: "extension_point_name"
        in: "path"
        description: "Name of the extension point"
        required: true
        schema:
          type: "string"
      - name: "extension_name"
        in: "path"
        description: "Name of the extension"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "Extension config schema"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/extension-config-schema"
        "204":
          description: "Extension has no config schema"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        "404":
          $ref: "#/components/responses/generic-not-found-error"
        default:
          $ref: "#/components/responses/generic-error"
  /extension-points/{extension_point_name}/extensions/{extension_name}/test:
    post:
      tags:
      - "Extensions"
      summary: "Test extension"
      description: "Tests an extension.\n\nIf the extension is configurable (i.e.\
        \ `/config-schema` returns status `200`),\na valid configuration **must**\
        \ be provided in the test request.\nThe configuration is validated against\
        \ the applicable JSON schema.\n\n**Do not use clear text credentials in the\
        \ supplied config**.\nFields annotated with `x-secret-ref` in the config schema\
        \ expect\na name of a managed secret, which is resolved internally by the\
        \ API.\n\nTest results contain one or more checks, each of which can have\
        \ a status of\n`PASSED`, `FAILED`, or `SKIPPED`. If *at least one* check is\
        \ `FAILED`,\nthe entire test should be considered `FAILED`.\n\nRequires the\
        \ `SYSTEM_CONFIGURATION` or `SYSTEM_CONFIGURATION_UPDATE` permission."
      operationId: "testExtension"
      parameters:
      - name: "extension_point_name"
        in: "path"
        description: "Name of the extension point"
        required: true
        schema:
          type: "string"
      - name: "extension_name"
        in: "path"
        description: "Name of the extension"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/test-extension-request"
        required: true
      responses:
        "200":
          description: "Test result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/test-extension-response"
        "400":
          description: "Bad Request"
          content:
            application/problem+json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/json-schema-validation-problem-details"
                - $ref: "#/components/schemas/problem-details"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        "404":
          $ref: "#/components/responses/generic-not-found-error"
        default:
          $ref: "#/components/responses/generic-error"
  /kev-data-sources/{name}/mirror-runs:
    post:
      tags:
      - "Kev Data Sources"
      summary: "Trigger a KEV data source mirror run"
      description: "Triggers a mirror run for the given KEV data source.\n\nRequires\
        \ permission `SYSTEM_CONFIGURATION` or `SYSTEM_CONFIGURATION_UPDATE`."
      operationId: "triggerKevDataSourceMirrorRun"
      parameters:
      - name: "name"
        in: "path"
        description: "Name of the KEV data source (e.g. `cisa`, `enisa`)."
        required: true
        schema:
          type: "string"
      responses:
        "202":
          description: "Mirror run triggered"
          headers:
            Location:
              description: "URL of the latest mirror run resource."
              schema:
                type: "string"
                format: "uri"
        "400":
          description: "Mirror run cannot be started"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problem-details"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        "404":
          $ref: "#/components/responses/generic-not-found-error"
        "409":
          description: "A mirror run is already in progress"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problem-details"
        default:
          $ref: "#/components/responses/generic-error"
  /kev-data-sources/{name}/mirror-runs/latest:
    get:
      tags:
      - "Kev Data Sources"
      summary: "Get the latest KEV data source mirror run"
      description: "Returns the status of the most recent mirror run for a given\n\
        KEV data source.\n\nReturns 404 if no mirror run is available\n(e.g. none\
        \ has been triggered yet, or the most recent run\nis no longer retained),\
        \ or if the data source is unknown.\n\nRequires permission `SYSTEM_CONFIGURATION`\
        \ or `SYSTEM_CONFIGURATION_READ`."
      operationId: "getLatestKevDataSourceMirrorRun"
      parameters:
      - name: "name"
        in: "path"
        description: "Name of the KEV data source (e.g. `cisa`, `enisa`)."
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "Mirror run status"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/kev-data-source-mirror-status"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        "404":
          $ref: "#/components/responses/generic-not-found-error"
        default:
          $ref: "#/components/responses/generic-error"
  /projects/{uuid}/clone:
    post:
      tags:
      - "Projects"
      summary: "Clones a given project."
      description: "Requires permission `PORTFOLIO_MANAGEMENT` or `PORTFOLIO_MANAGEMENT_CREATE`"
      operationId: "cloneProject"
      parameters:
      - name: "uuid"
        in: "path"
        description: "The UUID of the project to clone"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/clone-project-request"
      responses:
        "201":
          description: "Project cloned"
          headers:
            Location:
              description: "URL of the cloned project"
              schema:
                type: "string"
                format: "uri"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/clone-project-response"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        "404":
          $ref: "#/components/responses/generic-not-found-error"
        "409":
          $ref: "#/components/responses/generic-conflict-error"
        default:
          $ref: "#/components/responses/generic-error"
  /projects/{uuid}/components:
    get:
      tags:
      - "Projects"
      summary: "Retrieves a list of all components for a given project."
      description: "Requires permission `VIEW_PORTFOLIO`\n\n### Sortable fields\n\n\
        Sorting is supported for the following fields:\n\n* `name`\n* `group`\n* `last_inherited_risk_score`\n\
        * `package_artifact_metadata.published_at`\n\nComponents without resolved\
        \ artifact metadata, or whose upstream registry did not\nreport a publication\
        \ date, are placed at the end of the result for both sort\ndirections when\
        \ sorting by `package_artifact_metadata.published_at`.\n\n### Expandable fields\n\
        \nThe following fields can be included via `expand`:\n\n* `metrics`\n* `package_metadata`\n\
        * `package_artifact_metadata`\n* `occurrence_count`"
      operationId: "listProjectComponents"
      parameters:
      - name: "uuid"
        in: "path"
        description: "The UUID of the project to retrieve components for"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "only_outdated"
        in: "query"
        description: "Optionally exclude recent components so only outdated components\
          \ are returned"
        schema:
          type: "boolean"
      - name: "only_direct"
        in: "query"
        description: "Optionally exclude transitive dependencies so only direct dependencies\
          \ are returned"
        schema:
          type: "boolean"
      - name: "q"
        in: "query"
        description: "Optional free-text search term. Matches components whose `group`\
          \ or `name` contains the given value (case-insensitive)."
        schema:
          type: "string"
      - name: "expand"
        in: "query"
        description: "Optional fields to include in each component response item.\
          \ Unknown values are silently ignored."
        style: "form"
        explode: true
        schema:
          type: "array"
          items:
            type: "string"
      - name: "limit"
        in: "query"
        description: "Maximum number of items to retrieve from the collection"
        schema:
          maximum: 1000
          minimum: 1
          type: "integer"
          format: "int32"
          default: 100
      - name: "page_token"
        in: "query"
        description: "Opaque token pointing to a specific position in a collection"
        schema:
          type: "string"
      - name: "sort_direction"
        in: "query"
        schema:
          $ref: "#/components/schemas/sort-direction"
      - name: "sort_by"
        in: "query"
        description: "Field to sort by. Refer to the operation description for information\
          \ about which fields are sortable."
        schema:
          maxLength: 255
          minLength: 1
          type: "string"
      responses:
        "200":
          description: "A list of all components for a given project"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list-project-components-response"
        "400":
          description: "Bad Request"
          content:
            application/problem+json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/invalid-sort-field-problem-details"
                - $ref: "#/components/schemas/problem-details"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        "404":
          $ref: "#/components/responses/generic-not-found-error"
        default:
          $ref: "#/components/responses/generic-error"
