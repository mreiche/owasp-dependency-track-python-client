    get:
      tags:
      - "Task Queues"
      summary: "List task queues"
      description: "Returns a paginated list of task queues of the given type.\n\n\
        Requires the `SYSTEM_CONFIGURATION` or `SYSTEM_CONFIGURATION_READ` permission."
      operationId: "listTaskQueues"
      parameters:
      - name: "type"
        in: "path"
        description: "Type of task queues to list"
        required: true
        schema:
          $ref: "#/components/schemas/task-queue-type"
      - name: "limit"
        in: "query"
        description: "Maximum number of items to retrieve from the collection"
        schema:
          maximum: 1000
          minimum: 1
          type: "integer"
          format: "int32"
          default: 100
      - name: "page_token"
        in: "query"
        description: "Opaque token pointing to a specific position in a collection"
        schema:
          type: "string"
      responses:
        "200":
          description: "Paginated list of task queues"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list-task-queues-response"
        "400":
          $ref: "#/components/responses/invalid-request-error"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        default:
          $ref: "#/components/responses/generic-error"
  /internal/task-queues/{type}/{name}:
    patch:
      tags:
      - "Task Queues"
      summary: "Update a task queue"
      description: "Updates the status and/or capacity of a task queue.\n\nRequires\
        \ the `SYSTEM_CONFIGURATION` or `SYSTEM_CONFIGURATION_UPDATE` permission."
      operationId: "updateTaskQueue"
      parameters:
      - name: "type"
        in: "path"
        description: "Type of the task queue"
        required: true
        schema:
          $ref: "#/components/schemas/task-queue-type"
      - name: "name"
        in: "path"
        description: "Name of the task queue"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/update-task-queue-request"
        required: true
      responses:
        "204":
          description: "Task queue updated"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        "404":
          $ref: "#/components/responses/generic-not-found-error"
        default:
          $ref: "#/components/responses/generic-error"
  /internal/workflow-instances/{id}:
    get:
      tags:
      - "Workflows"
      summary: "Get a workflow instance"
      description: "Returns run metadata of a given workflow instance.\n\nMultiple\
        \ runs can share an instance ID, but only a single run can exist\nin non-terminal\
        \ state at any given time. Thus, this operation only\nreturns metadata if\
        \ a run in non-terminal state exists.\n\nTo list all runs for an instance\
        \ ID, including terminated ones,\nuse the `/internal/workflow-runs` endpoint\
        \ and filter by `workflow_instance_id`.\n\nRequires the `SYSTEM_CONFIGURATION`\
        \ or `SYSTEM_CONFIGURATION_READ` permission."
      operationId: "getWorkflowInstance"
      parameters:
      - name: "id"
        in: "path"
        description: "ID of the workflow instance"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "Workflow run metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/workflow-run-metadata"
        "400":
          $ref: "#/components/responses/invalid-request-error"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        "404":
          $ref: "#/components/responses/generic-not-found-error"
        default:
          $ref: "#/components/responses/generic-error"
  /internal/workflow-runs:
    get:
      tags:
      - "Workflows"
      summary: "List all workflow runs"
      description: "Returns a paginated list of workflow runs.\n\n### Sortable fields\n\
        \nSorting is supported for the for the following fields:\n\n* `id`\n* `created_at`\n\
        * `completed_at`\n\nRequires the `SYSTEM_CONFIGURATION` or `SYSTEM_CONFIGURATION_READ`\
        \ permission."
      operationId: "listWorkflowRuns"
      parameters:
      - name: "workflow_name"
        in: "query"
        description: "Name of the workflow to filter by. Must be an exact match."
        schema:
          type: "string"
      - name: "workflow_version"
        in: "query"
        description: "Version of the workflow to filter by. Must be an exact match."
        schema:
          maximum: 100
          minimum: 1
          type: "integer"
          format: "int32"
      - name: "workflow_instance_id"
        in: "query"
        description: "Workflow instance ID to filter by. Must be an exact match."
        schema:
          type: "string"
      - name: "status"
        in: "query"
        description: "Status to filter by"
        schema:
          $ref: "#/components/schemas/workflow-run-status"
      - name: "label"
        in: "query"
        description: "Filter by label in `key=value` form. Repeat to require multiple\
          \ labels.\nA run matches only if it carries every supplied label.\nOn duplicate\
          \ keys the last occurrence wins."
        style: "form"
        explode: true
        schema:
          type: "array"
          items:
            pattern: "^[^=]+=.*$"
            type: "string"
      - name: "created_since"
        in: "query"
        description: "Filter runs created on or after this timestamp."
        schema:
          $ref: "#/components/schemas/timestamp"
      - name: "created_before"
        in: "query"
        description: "Filter runs created before this timestamp."
        schema:
          $ref: "#/components/schemas/timestamp"
      - name: "completed_since"
        in: "query"
        description: "Filter runs completed on or after this timestamp."
        schema:
          $ref: "#/components/schemas/timestamp"
      - name: "completed_before"
        in: "query"
        description: "Filter runs completed before this timestamp."
        schema:
          $ref: "#/components/schemas/timestamp"
      - name: "limit"
        in: "query"
        description: "Maximum number of items to retrieve from the collection"
        schema:
          maximum: 1000
          minimum: 1
          type: "integer"
          format: "int32"
          default: 100
      - name: "page_token"
        in: "query"
        description: "Opaque token pointing to a specific position in a collection"
        schema:
          type: "string"
      - name: "sort_direction"
        in: "query"
        schema:
          $ref: "#/components/schemas/sort-direction"
      - name: "sort_by"
        in: "query"
        description: "Field to sort by. Refer to the operation description for information\
          \ about which fields are sortable."
        schema:
          maxLength: 255
          minLength: 1
          type: "string"
      responses:
        "200":
          description: "Paginated list of workflow runs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list-workflow-runs-response"
        "400":
          description: "Bad Request"
          content:
            application/problem+json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/invalid-request-problem-details"
                - $ref: "#/components/schemas/invalid-sort-field-problem-details"
                - $ref: "#/components/schemas/problem-details"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        default:
          $ref: "#/components/responses/generic-error"
  /internal/workflow-runs/{id}:
    get:
      tags:
      - "Workflows"
      summary: "Get a workflow run"
      description: "Returns metadata of a given workflow run.\n\nRequires the `SYSTEM_CONFIGURATION`\
        \ or `SYSTEM_CONFIGURATION_READ` permission."
      operationId: "getWorkflowRun"
      parameters:
      - name: "id"
        in: "path"
        description: "ID of the workflow run"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Workflow run metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/workflow-run-metadata"
        "400":
          $ref: "#/components/responses/invalid-request-error"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        "404":
          $ref: "#/components/responses/generic-not-found-error"
        default:
          $ref: "#/components/responses/generic-error"
  /internal/workflow-runs/{id}/events:
    get:
      tags:
      - "Workflows"
      summary: "List all events of a workflow run"
      description: "Returns a paginated list of workflow run events, sorted by sequence\
        \ number.\n\nRequires the `SYSTEM_CONFIGURATION` or `SYSTEM_CONFIGURATION_READ`\
        \ permission."
      operationId: "listWorkflowRunEvents"
      parameters:
      - name: "id"
        in: "path"
        description: "ID of the workflow run"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "from_sequence_number"
        in: "query"
        description: "Sequence number of the last seen event.\nMay be used to continuously\
          \ poll for new events.\nCan not be used together with `page_token`."
        schema:
          minimum: 0
          type: "integer"
          format: "int32"
      - name: "limit"
        in: "query"
        description: "Maximum number of items to retrieve from the collection"
        schema:
          maximum: 1000
          minimum: 1
          type: "integer"
          format: "int32"
          default: 100
      - name: "page_token"
        in: "query"
        description: "Opaque token pointing to a specific position in a collection"
        schema:
          type: "string"
      - name: "sort_direction"
        in: "query"
        schema:
          $ref: "#/components/schemas/sort-direction"
      responses:
        "200":
          description: "Paginated list of workflow run events"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list-workflow-run-events-response"
        "400":
          $ref: "#/components/responses/invalid-request-error"
        "401":
          $ref: "#/components/responses/generic-unauthorized-error"
        "403":
          $ref: "#/components/responses/generic-forbidden-error"
        default:
          $ref: "#/components/responses/generic-error"
components:
  schemas:
    timestamp:
      type: "integer"
      description: "Epoch timestamp in milliseconds since January 1, 1970 UTC."
      format: "int64"
      example: 1752209050377
    project-state:
      type: "string"
      enum:
      - "ACTIVE"
      - "INACTIVE"
    sort-direction:
      type: "string"
      enum:
      - "ASC"
      - "DESC"
    list-components-response:
      required:
      - "items"
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/list-components-response-item"
      allOf:
      - $ref: "#/components/schemas/paginated-response"
    invalid-sort-field-problem-details:
      required:
      - "invalid_field"
      type: "object"
      properties:
        invalid_field:
          type: "string"
          description: "Name of the field for which sorting is not supported."
        supported_fields:
          type: "array"
          description: "Names of fields for which sorting is supported.\nWhen empty,\
            \ sorting is explicitly *not* supported.\nWhen absent, sorting may be\
            \ supported, but no definitive guarantees exist.\nConsult the operation's\
            \ description."
          items:
            type: "string"
      allOf:
      - $ref: "#/components/schemas/problem-details"
    problem-details:
      required:
      - "detail"
      - "title"
      - "type"
      type: "object"
      properties:
        type:
          type: "string"
          description: "A URI reference that identifies the problem type"
          format: "uri-reference"
          default: "about:blank"
        status:
          maximum: 599
          minimum: 400
          type: "integer"
          description: "HTTP status code generated by the origin server for this occurrence\
            \ of the problem"
          format: "int32"
          example: 500
        title:
          maxLength: 255
          type: "string"
          description: "Short, human-readable summary of the problem type"
        detail:
          maxLength: 1024
          type: "string"
          description: "Human-readable explanation specific to this occurrence of\
            \ the problem"
        instance:
          type: "string"
          description: "Reference URI that identifies the specific occurrence of the\
            \ problem"
          format: "uri-reference"
      description: "An RFC 9457 problem object."
      externalDocs:
        url: "https://www.rfc-editor.org/rfc/rfc9457.html"
      x-parent: true
    create-component-request:
      required:
      - "name"
      - "project_uuid"
      type: "object"
      properties:
        project_uuid:
          type: "string"
          format: "uuid"
        name:
          maxLength: 255
          type: "string"
        description:
          maxLength: 255
          type: "string"
        group:
          maxLength: 255
          type: "string"
        version:
          maxLength: 255
          type: "string"
        classifier:
          $ref: "#/components/schemas/classifier"
        filename:
          maxLength: 255
          type: "string"
        extension:
          maxLength: 255
          type: "string"
        hashes:
          $ref: "#/components/schemas/hashes"
        cpe:
          maxLength: 255
          type: "string"
        publisher:
          maxLength: 255
          type: "string"
        supplier:
          $ref: "#/components/schemas/organizational-entity"
        authors:
          type: "array"
          items:
            $ref: "#/components/schemas/organizational-contact"
        purl:
          maxLength: 1024
          type: "string"
        swid_tag_id:
          maxLength: 255
          type: "string"
        internal:
          type: "boolean"
        copyright:
          maxLength: 255
          type: "string"
        license:
          maxLength: 255
          type: "string"
        license_expression:
          maxLength: 255
          type: "string"
        license_url:
          maxLength: 255
          type: "string"
        notes:
          maxLength: 255
          type: "string"
    invalid-request-problem-details:
      required:
      - "errors"
      type: "object"
      properties:
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/constraint-violation-error"
      allOf:
      - $ref: "#/components/schemas/problem-details"
    list-extension-points-response:
      required:
      - "items"
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/list-extension-points-response-item"
      allOf:
      - $ref: "#/components/schemas/paginated-response"
    list-extensions-response:
      required:
      - "items"
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/list-extensions-response-item"
      allOf:
      - $ref: "#/components/schemas/paginated-response"
    get-extension-config-response:
      required:
      - "config"
      type: "object"
      properties:
        config:
          type: "object"
          additionalProperties: true
    update-extension-config-request:
      required:
      - "config"
      type: "object"
      properties:
        config:
          type: "object"
          additionalProperties: true
    json-schema-validation-problem-details:
      required:
      - "errors"
      type: "object"
      properties:
        errors:
          type: "array"
          description: "List of JSON Schema validation errors"
          items:
            $ref: "#/components/schemas/json-schema-validation-error"
      allOf:
      - $ref: "#/components/schemas/problem-details"
    extension-config-schema:
      required:
      - "$schema"
      type: "object"
      properties:
        $schema:
          type: "string"
          format: "uri"
      additionalProperties: true
    test-extension-request:
      type: "object"
      properties:
        config:
          type: "object"
          additionalProperties: true
    test-extension-response:
      required:
      - "checks"
      type: "object"
      properties:
        checks:
          type: "array"
          items:
            $ref: "#/components/schemas/extension-test-check"
    kev-data-source-mirror-status:
      required:
      - "status"
      type: "object"
      properties:
        status:
          type: "string"
          description: "Status of the mirror run."
          enum:
          - "PENDING"
          - "RUNNING"
          - "COMPLETED"
          - "FAILED"
        started_at:
          $ref: "#/components/schemas/timestamp"
        completed_at:
          $ref: "#/components/schemas/timestamp"
        failure_reason:
          type: "string"
          description: "Reason for why the mirror run failed."
    clone-project-request:
      required:
      - "version"
      type: "object"
      properties:
        version:
          minLength: 1
          type: "string"
          description: "Version of the cloned project."
        version_is_latest:
          type: "boolean"
          description: "Whether to mark the cloned project version as latest. If another\
            \ version is already marked as latest, it will be atomically un-unmarked\
            \ as part of the cloning operation."
          default: false
        includes:
          uniqueItems: true
          type: "array"
          description: "List of items to include in the clone:\n\n  * `ACL`: Include\
            \ portfolio ACL definitions.\n  * `COMPONENTS`: Include components.\n\
            \  * `FINDINGS`: Include findings.\n      * Has no effect unless `COMPONENTS`\
            \ is also included.\n  * `FINDINGS_AUDIT_HISTORY`: Include audit history\
            \ of findings.\n      * Has no effect unless `FINDINGS` is also included.\n\
            \  * `POLICY_VIOLATIONS`: Include policy violations.\n      * Has no effect\
            \ unless `COMPONENTS` is also included.\n  * `POLICY_VIOLATIONS_AUDIT_HISTORY`:\
            \ Include audit history of policy violations.\n      * Has no effect unless\
            \ `POLICY_VIOLATIONS` is also included.\n  * `PROPERTIES`: Include project\
            \ properties.\n  * `SERVICES`: Include services.\n  * `TAGS`: Include\
            \ project tags."
          items:
            $ref: "#/components/schemas/clone-project-include"
          default: []
    clone-project-response:
      required:
      - "uuid"
      type: "object"
      properties:
        uuid:
          type: "string"
          description: "UUID of the cloned project."
          format: "uuid"
    list-project-components-response:
      required:
      - "items"
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/list-project-components-response-item"
      allOf:
      - $ref: "#/components/schemas/paginated-response"
    list-secrets-response:
      required:
      - "items"
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/secret-metadata"
      allOf:
      - $ref: "#/components/schemas/paginated-response"
    create-secret-request:
      required:
      - "name"
      - "value"
      type: "object"
      properties:
        name:
          $ref: "#/components/schemas/secret-name"
        description:
          maxLength: 255
          type: "string"
        value:
          maxLength: 4096
          minLength: 1
          type: "string"
    secret-name:
      pattern: "^[a-zA-Z0-9_-]{1,64}$"
      type: "string"
      example: "MY_SECRET"
    secret-metadata:
      required:
      - "name"
      type: "object"
      properties:
        name:
          $ref: "#/components/schemas/secret-name"
        description:
          type: "string"
        created_at:
          $ref: "#/components/schemas/timestamp"
        updated_at:
          $ref: "#/components/schemas/timestamp"
    update-secret-request:
      type: "object"
      properties:
        description:
          maxLength: 255
          type: "string"
          description: "The new description. Omit this field to retain the current\
            \ description."
        value:
          maxLength: 4096
          minLength: 1
          type: "string"
          description: "The new value. Omit this field to retain the current value."
    list-vuln-policies-response:
      required:
      - "items"
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/list-vuln-policies-response-item"
      allOf:
