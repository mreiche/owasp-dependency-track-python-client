          type: "string"
        description:
          maxLength: 512
          type: "string"
        author:
          maxLength: 255
          type: "string"
        condition:
          maxLength: 4096
          minLength: 1
          type: "string"
        analysis:
          $ref: "#/components/schemas/vuln-policy-analysis"
        ratings:
          maxItems: 3
