name: Test

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  determine_changes:
    name: Determine changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.determine.outputs.source }}
      test: ${{ steps.determine.outputs.test }}
      project: ${{ steps.determine.outputs.project }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run change detection
        id: determine
        uses: ./.github/actions/determine-changes

  test-and-build:
    name: "Test"
    runs-on: ubuntu-latest
    permissions: write-all
    needs: determine_changes
    if: github.event.pull_request.draft == false
      && (
      needs.determine_changes.outputs.project == 'true'
      || needs.determine_changes.outputs.source == 'true'
      || needs.determine_changes.outputs.test == 'true'
      )
    steps:
      - uses: actions/checkout@v6

      - name: Run docker-compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: "./test/docker-compose.yml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - run: pip install -e .[test]

      - name: Run tests
        env:
          PYTHONPATH: "."
        run: |
          pytest \
            --junitxml=./test-results/tests.xml \
            --cov=./owasp_dt \
            --cov=./owasp_dt_v2 \
            ./test

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            test-results/**/*.xml

      - name: Generate coverage report
        run: coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          #fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
