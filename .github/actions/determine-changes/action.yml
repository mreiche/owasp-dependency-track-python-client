name: "Determine Changed Areas"
description: "Detects changed paths and sets outputs for workflow decisions"
outputs:
  source:
    description: "Whether source changed"
    value: ${{ steps.filter.outputs.source }}
  project:
    description: "Whether project changed"
    value: ${{ steps.filter.outputs.project }}
  test:
    description: "Whether tests changed"
    value: ${{ steps.filter.outputs.test }}

runs:
  using: "composite"
  steps:
    - name: Detect changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          source:
            - 'owasp_dt/**'
            - 'owasp_dt_v2/**'
          test:
            - 'test/**'
          project:
            - 'pyproject.toml'
            - '.github/**'
